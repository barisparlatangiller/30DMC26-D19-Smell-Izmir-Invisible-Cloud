name: Fetch İzmir district boundaries (OSM admin_level 6)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fetch_districts.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass → GeoJSON
        run: |
          set -x
          mkdir -p /tmp/f/out && cd /tmp/f
          J=$(curl -fsSL -m 60 https://www.geoboundaries.org/api/current/gbOpen/TUR/ADM2/)
          echo "$J" | head -c 1500
          U=$(echo "$J" | python3 -c "import json,sys;print(json.load(sys.stdin)['gjDownloadURL'])")
          curl -fsSL -m 300 -o adm2.geojson "$U"
          python3 - <<'PY'
          import json
          d = json.load(open('adm2.geojson'))
          def bb(g):
              xs=[];ys=[]
              def walk(c):
                  if isinstance(c[0], (int, float)): xs.append(c[0]); ys.append(c[1])
                  else: [walk(x) for x in c]
              walk(g['coordinates']); return min(xs),min(ys),max(xs),max(ys)
          keep=[f for f in d['features'] if (lambda b: b[2]>26.85 and b[0]<27.35 and b[3]>38.30 and b[1]<38.60)(bb(f['geometry']))]
          for f in keep: f['properties']={'name': f['properties'].get('shapeName')}
          print(len(keep), [f['properties']['name'] for f in keep])
          json.dump({'type':'FeatureCollection','features':keep}, open('out/izmir_districts.geojson','w'), ensure_ascii=False)
          PY
          cd out && git init -q -b fetched2 && git add -A && git -c user.name=gha -c user.email=gha@users.noreply.github.com commit -qm "districts"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" fetched2:fetched2 2>&1 | tail -2
